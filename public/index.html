<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prep! · Practice Before It Matters</title>
  <meta name="description" content="Rehearse important moments with a simulated audience that reacts in real time." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="fonts/host-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="site-header" class="relative z-40"></header>

  <main id="main">
    <!-- Opening: text column + static shape assembly -->
    <section class="page grid items-center gap-10 pb-14 pt-6 md:pt-10 lg:grid-cols-[1.15fr_1fr] lg:gap-6 lg:pb-20" aria-labelledby="hero-title">
      <div>
        <p class="chip mb-7 bg-selection">
          <i data-lucide="sparkles" class="h-4 w-4 text-accent" aria-hidden="true"></i>
          <span data-i18n="tagline"></span>
        </p>
        <h1 id="hero-title" class="display-xl max-w-[11ch]" data-i18n="home_headline"></h1>
        <p class="mt-7 max-w-xl text-lg leading-relaxed text-ink/80" data-i18n="home_subheadline"></p>
        <div class="mt-10 flex flex-wrap items-center gap-x-5 gap-y-4">
          <a href="setup.html" class="btn btn-primary btn-lg">
            <span data-i18n="nav_start"></span>
            <i data-lucide="arrow-right" class="h-5 w-5" aria-hidden="true"></i>
          </a>
          <a href="#drills" class="btn btn-secondary">
            <i data-lucide="timer" class="h-5 w-5" aria-hidden="true"></i>
            <span data-i18n="home_browseDrills"></span>
          </a>
        </div>
      </div>

      <div class="relative mx-auto w-full max-w-[540px]" aria-hidden="true">
        <svg viewBox="0 0 520 470" class="h-auto w-full" role="presentation" focusable="false">
          <g stroke="#252b3a" stroke-width="3" stroke-linejoin="round">
            <!-- mint base -->
            <rect x="34" y="306" width="452" height="134" rx="30" fill="#252b3a" transform="translate(8 8)" />
            <rect x="34" y="306" width="452" height="134" rx="30" fill="#9bf1cd" />
            <!-- violet circle -->
            <circle cx="188" cy="190" r="118" fill="#252b3a" transform="translate(8 8)" />
            <circle cx="188" cy="190" r="118" fill="#6434df" />
            <!-- amber arch -->
            <path d="M300 306 V196 a92 92 0 0 1 184 0 V306 Z" fill="#252b3a" transform="translate(8 8)" />
            <path d="M300 306 V196 a92 92 0 0 1 184 0 V306 Z" fill="#ffd05b" />
            <!-- pink triangle -->
            <polygon points="432,14 492,104 372,104" fill="#252b3a" transform="translate(6 6)" />
            <polygon points="432,14 492,104 372,104" fill="#ff78c5" />
            <!-- presentation card -->
            <rect x="84" y="232" width="190" height="124" rx="16" fill="#252b3a" transform="translate(7 7)" />
            <rect x="84" y="232" width="190" height="124" rx="16" fill="#ffffff" />
            <rect x="106" y="256" width="86" height="12" rx="6" fill="#6434df" stroke="none" />
            <rect x="106" y="282" width="146" height="9" rx="4.5" fill="#b8b6c5" stroke="none" />
            <rect x="106" y="302" width="120" height="9" rx="4.5" fill="#b8b6c5" stroke="none" />
            <rect x="106" y="322" width="64" height="9" rx="4.5" fill="#b8b6c5" stroke="none" />
            <!-- audience heads on the base -->
            <circle cx="336" cy="372" r="22" fill="#ffffff" />
            <circle cx="400" cy="372" r="22" fill="#ff78c5" />
            <circle cx="464" cy="372" r="22" fill="#ffffff" />
            <!-- sparse confetti -->
            <circle cx="56" cy="62" r="13" fill="#ffd05b" />
            <rect x="300" y="36" width="22" height="22" rx="5" fill="#9bf1cd" transform="rotate(14 311 47)" />
          </g>
        </svg>
      </div>
    </section>

    <!-- Fact strip on layered mint + outlined bases -->
    <section class="page" aria-label="Prep! at a glance">
      <div class="relative">
        <div class="absolute inset-0 translate-x-3 translate-y-3 rounded-[26px] border-line border-outline bg-mint md:translate-x-4 md:translate-y-4" aria-hidden="true"></div>
        <ul class="relative grid grid-cols-2 rounded-[26px] border-line border-outline bg-panel md:grid-cols-4">
          <li class="border-b-2 border-r-2 border-dashed border-rule p-5 md:border-b-0 md:p-7">
            <span class="block font-display text-4xl font-extrabold md:text-5xl">6</span>
            <span class="mt-1 block text-label text-ink/80" data-i18n="home_fact1"></span>
          </li>
          <li class="border-b-2 border-dashed border-rule p-5 md:border-b-0 md:border-r-2 md:p-7">
            <span class="block font-display text-4xl font-extrabold md:text-5xl">6</span>
            <span class="mt-1 block text-label text-ink/80" data-i18n="home_fact2"></span>
          </li>
          <li class="border-r-2 border-dashed border-rule p-5 md:p-7">
            <span class="block font-display text-4xl font-extrabold md:text-5xl">2</span>
            <span class="mt-1 block text-label text-ink/80" data-i18n="home_fact3"></span>
          </li>
          <li class="p-5 md:p-7">
            <span class="block font-display text-4xl font-extrabold md:text-5xl" data-i18n="home_fact4"></span>
            <span class="mt-1 block text-label text-ink/80" data-i18n="home_fact4Desc"></span>
          </li>
        </ul>
      </div>
    </section>

    <!-- Numbered process strip -->
    <section class="page mt-24 md:mt-28" aria-labelledby="how-title">
      <h2 id="how-title" class="heading mb-10" data-i18n="home_how"></h2>
      <ol class="step-strip">
        <li class="flex gap-5 md:flex-col md:items-center md:text-center">
          <span class="step-badge shape-circle bg-mint" aria-hidden="true">1</span>
          <div class="pt-2 md:pt-0">
            <h3 class="subheading" data-i18n="home_step1"></h3>
            <p class="mt-1.5 max-w-xs text-ink/80" data-i18n="home_step1Desc"></p>
          </div>
        </li>
        <li class="flex gap-5 md:flex-col md:items-center md:text-center">
          <span class="step-badge shape-square bg-amber" aria-hidden="true">2</span>
          <div class="pt-2 md:pt-0">
            <h3 class="subheading" data-i18n="home_step2"></h3>
            <p class="mt-1.5 max-w-xs text-ink/80" data-i18n="home_step2Desc"></p>
          </div>
        </li>
        <li class="flex gap-5 md:flex-col md:items-center md:text-center">
          <span class="step-badge shape-arch bg-pink" aria-hidden="true">3</span>
          <div class="pt-2 md:pt-0">
            <h3 class="subheading" data-i18n="home_step3"></h3>
            <p class="mt-1.5 max-w-xs text-ink/80" data-i18n="home_step3Desc"></p>
          </div>
        </li>
      </ol>
    </section>

    <!-- Scenario picker inside the shared book -->
    <section class="page mt-28 md:mt-32" aria-labelledby="scenarios-title">
      <div class="book px-5 pb-8 pt-10 md:px-12 md:pb-12 md:pt-14">
        <span class="book-tab bg-amber">
          <i data-lucide="layout-grid" class="h-4 w-4" aria-hidden="true"></i>
          <span data-i18n="home_scenariosTab"></span>
        </span>
        <div class="mb-8 max-w-2xl">
          <h2 id="scenarios-title" class="heading" data-i18n="home_scenarios"></h2>
          <p class="mt-2 text-ink/80" data-i18n="home_scenariosLead"></p>
        </div>
        <ul id="scenario-list" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></ul>
      </div>
    </section>

    <!-- Quick drills: today's challenge + comparison tickets -->
    <section id="drills" class="page mt-28 scroll-mt-6 md:mt-32" aria-labelledby="drills-title">
      <div class="mb-8 max-w-2xl">
        <h2 id="drills-title" class="heading" data-i18n="home_drills"></h2>
        <p class="mt-2 text-ink/80" data-i18n="home_drillsLead"></p>
      </div>
      <div id="daily-drill"></div>
      <ul id="drill-list" class="mt-8 grid gap-6 lg:grid-cols-2"></ul>
    </section>

    <!-- Mint back cover with the closing statement and the inset footer -->
    <section class="mt-28 px-3 pb-3 md:mt-36 md:px-5 md:pb-5" aria-labelledby="closing-title">
      <div class="relative overflow-hidden rounded-[44px] border-line border-outline bg-mint px-3 pt-16 md:rounded-[60px] md:px-5 md:pt-24">
        <svg class="pointer-events-none absolute inset-0 h-full w-full" aria-hidden="true" focusable="false">
          <g stroke="#252b3a" stroke-width="3">
            <circle cx="7%" cy="70" r="14" fill="#ffd05b" />
            <rect x="88%" y="56" width="24" height="24" rx="5" fill="#ff78c5" transform="rotate(18)" style="transform-box: fill-box; transform-origin: center" />
            <circle cx="94%" cy="250" r="9" fill="#6434df" />
            <circle cx="4%" cy="300" r="8" fill="#ffffff" />
          </g>
        </svg>
        <div class="relative mx-auto max-w-3xl px-2 text-center">
          <h2 id="closing-title" class="display-lg" data-i18n="home_closing"></h2>
          <p class="mx-auto mt-5 max-w-xl text-lg text-ink/85" data-i18n="home_subheadline"></p>
          <a href="setup.html" class="btn btn-primary btn-lg mt-9">
            <span data-i18n="nav_start"></span>
            <i data-lucide="arrow-right" class="h-5 w-5" aria-hidden="true"></i>
          </a>
        </div>

        <footer class="relative mb-3 mt-16 md:mb-5 rounded-b-[28px] rounded-t-[80px] border-line border-outline bg-slate px-6 pb-8 pt-12 text-ground md:mt-24 md:rounded-b-[36px] md:rounded-t-[140px] md:px-14 md:pt-16">
          <div class="grid grid-cols-2 gap-8 md:grid-cols-[1.4fr_1fr_1.4fr]">
            <div class="col-span-2 md:col-span-1">
              <p class="font-display text-2xl font-extrabold">Prep!</p>
              <p class="mt-1 text-ground/80" data-i18n="tagline"></p>
            </div>
            <nav aria-labelledby="footer-pages">
              <h2 id="footer-pages" class="text-meta font-bold uppercase tracking-[0.12em] text-ground/70" data-i18n="footer_pages"></h2>
              <ul class="mt-3 space-y-2 text-label">
                <li><a class="underline-offset-4 hover:underline" href="index.html" data-i18n="nav_home"></a></li>
                <li><a class="underline-offset-4 hover:underline" href="setup.html" data-i18n="nav_start"></a></li>
                <li><a class="underline-offset-4 hover:underline" href="#drills" data-i18n="home_drills"></a></li>
              </ul>
            </nav>
            <div>
              <h2 class="text-meta font-bold uppercase tracking-[0.12em] text-ground/70" data-i18n="footer_prototype"></h2>
              <p class="mt-3 text-label leading-relaxed text-ground/85" data-i18n="footer_prototypeDesc"></p>
            </div>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <script src="vendor/lucide.min.js"></script>
  <script type="module" src="js/home.js"></script>
</body>
</html>

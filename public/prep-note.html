<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prep note · Prep!</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="fonts/host-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="site-header" class="relative z-40"></header>

  <main id="main" class="page pb-24 pt-4">
    <div class="mx-auto max-w-[760px]">
      <a href="review.html" class="link-back">
        <i data-lucide="arrow-left" class="h-4 w-4" aria-hidden="true"></i>
        <span data-i18n="prep_backReview"></span>
      </a>

      <article class="book mt-14 px-5 pb-8 pt-10 md:px-10 md:pb-10 md:pt-12" aria-labelledby="note-title">
        <span class="book-tab bg-amber">
          <i data-lucide="book-open" class="h-4 w-4" aria-hidden="true"></i>
          <span>Prep!</span>
        </span>
        <h1 id="note-title" class="display-lg" data-i18n="prep_title"></h1>
        <p class="mt-2 text-lg text-ink/80" data-i18n="prep_subtitle"></p>
        <p class="mt-1 text-meta text-ink/75" data-i18n="prep_prototype"></p>
        <div id="note-body"></div>
      </article>

      <div class="mt-12 flex flex-wrap items-center justify-center gap-4">
        <button type="button" id="btn-copy" class="btn btn-secondary">
          <span id="copy-icon" class="inline-flex"><i data-lucide="copy" class="h-5 w-5" aria-hidden="true"></i></span>
          <span id="copy-label"></span>
        </button>
        <button type="button" id="btn-save" class="btn btn-secondary">
          <span id="save-icon" class="inline-flex"><i data-lucide="save" class="h-5 w-5" aria-hidden="true"></i></span>
          <span id="save-label"></span>
        </button>
        <a href="room.html" class="btn btn-secondary">
          <i data-lucide="rotate-ccw" class="h-5 w-5" aria-hidden="true"></i>
          <span data-i18n="review_retry"></span>
        </a>
        <a href="index.html" class="btn btn-primary">
          <i data-lucide="check" class="h-5 w-5" aria-hidden="true"></i>
          <span data-i18n="prep_done"></span>
        </a>
      </div>
      <p id="action-status" class="sr-only" aria-live="polite"></p>
    </div>
  </main>

  <script src="vendor/lucide.min.js"></script>
  <script type="module" src="js/prep-note.js"></script>
</body>
</html>

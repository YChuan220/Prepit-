<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setup · Prep!</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="fonts/host-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="site-header" class="relative z-40"></header>

  <main id="main" class="page pb-24 pt-4">
    <div class="mx-auto max-w-[960px]">
      <a href="index.html" class="link-back">
        <i data-lucide="arrow-left" class="h-4 w-4" aria-hidden="true"></i>
        <span data-i18n="common_back"></span>
      </a>
      <h1 class="display-lg mt-4" data-i18n="setup_title"></h1>
      <p class="mt-3 max-w-2xl text-lg text-ink/80" data-i18n="home_subheadline"></p>

      <div id="drill-banner" class="mt-8" hidden></div>

      <nav class="mt-10" aria-label="Setup steps">
        <ol id="stepper" class="stepper"></ol>
      </nav>

      <form id="setup-form" class="book mt-16 px-5 pb-8 pt-10 md:px-10 md:pb-10 md:pt-12" novalidate>
        <span id="step-tab" class="book-tab bg-pink"></span>
        <div id="step-panels"></div>

        <div class="mt-10 flex flex-wrap items-center justify-between gap-4 border-t-2 border-dashed border-rule pt-8">
          <button type="button" id="btn-back" class="btn btn-secondary">
            <i data-lucide="arrow-left" class="h-5 w-5" aria-hidden="true"></i>
            <span data-i18n="common_back"></span>
          </button>
          <div class="flex flex-wrap items-center gap-4">
            <button type="button" id="btn-skip" class="link-back" hidden>
              <span data-i18n="setup_skip"></span>
            </button>
            <button type="button" id="btn-next" class="btn btn-primary">
              <span data-i18n="common_next"></span>
              <i data-lucide="arrow-right" class="h-5 w-5" aria-hidden="true"></i>
            </button>
            <button type="submit" id="btn-enter" class="btn btn-primary btn-lg" hidden>
              <span data-i18n="setup_enter"></span>
              <i data-lucide="arrow-right" class="h-5 w-5" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script src="vendor/lucide.min.js"></script>
  <script type="module" src="js/setup.js"></script>
</body>
</html>
